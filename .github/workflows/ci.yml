name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Simulate and verify (Icarus Verilog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Icarus Verilog and PyCryptodome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          pip install pycryptodome
      - name: Compile testbench
        run: iverilog -g2012 -I ../src -s tb_des -o ../des_sim_v ../src/tb_des.v ../src/des_top.v ../src/des_round.v ../src/feistel.v ../src/sbox*.v ../src/lfsr.v
      - name: Run simulation
        run: vvp ../des_sim_v > ../output.txt && tail -n 20 ../output.txt
      - name: Check results against PyCryptodome DES
        run: |
          python3 verify_tb.py | tee ../verify.txt
          grep -Eq 'Verification Summary: ([1-9][0-9]*)/\1 passed\.' ../verify.txt || { echo "::error::DES simulation results do not match the reference"; exit 1; }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (changed commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..$GITHUB_SHA"; else RANGE="-1"; fi
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  notify:
    name: Notify failure
    if: failure() && github.event_name == 'push'
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL not set; skipping"; exit 0; }
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA::7}" --arg msg "$(printf '%s' "$MSG" | head -n1 | cut -c1-200)" \
                --arg actor "$GITHUB_ACTOR" --arg url "$URL" \
            '{username: "mac-server-watchdog", allowed_mentions: {parse: []}, embeds: [{
               title: ("🟡 CI FAILED · " + $repo), url: $url, color: 15844367,
               description: ("**CI failed** on main.\n`" + $sha + "` " + $msg),
               fields: [{name: "Author", value: $actor, inline: true}, {name: "Logs", value: ("[Open run](" + $url + ")"), inline: true}],
               footer: {text: "GitHub Actions · CI gate"}, timestamp: (now | todate)}]}' \
          | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
